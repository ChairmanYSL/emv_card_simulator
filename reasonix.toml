ore (never repeats)\n- 6-byte M/Chip-style CVR with correct result bits\n- Real RSA signatures for SDA/DDA/CDA (SHA1withRSA)\n- CertificateProvider: return empty chain + log instead of throwing\n  UnsupportedOperationException; JSON certificate import parsing\n'@; git log --oneline -3", "Bash=git add reasonix.toml; git commit -m \"chore: record reasonix permission allowlist\"; git log --oneline -3; Write-Host '--- status ---'; git status --short"]
