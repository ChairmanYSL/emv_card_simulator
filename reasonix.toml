[permissions]
allow = ["Bash=git rev-parse --is-inside-work-tree 2>$null; git branch --show-current 2>$null; Get-ChildItem app/src/main/res/xml | Select-Object -ExpandProperty Name", "Edit", "Bash=Get-Content .gitignore; Write-Host '---'; ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -T git@github.com 2>&1 | Select-Object -First 5"]
